<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0B5FA5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F7A4D"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B42318"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="560" rx="12" fill="url(#bgGrad)" stroke="#D7DEE8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" font-size="20" font-weight="bold" fill="#002A5C">ẨN DỤ ĐỜI THƯỜNG: VÌ SAO CẦN EVENT BUS (MÔ HÌNH QUẦY CÀ PHÊ HIGHLAND)?</text>
  <text x="40" y="60" font-size="13" fill="#667085">So sánh giữa cách gọi trực tiếp gây nghẽn tắc (HTTP RPC) và cách dùng hàng đợi phiếu thứ tự (Kafka Event Bus)</text>

  <!-- ==================== TOP: CÁCH 1 - GỌI TRỰC TIẾP (BLOCKING) ==================== -->
  <rect x="35" y="80" width="1030" height="195" rx="8" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="35" y="80" width="1030" height="34" rx="8" fill="#FEECEB"/>
  <text x="50" y="103" font-size="14" font-weight="bold" fill="#B42318">CÁCH 1: GỌI TRỰC TIẾP (HTTP RPC) — KHÔNG CÓ KAFKA (DỄ NGHẼN TẮC DÂY CHUYỀN)</text>

  <!-- Khach hang -->
  <rect x="55" y="130" width="150" height="70" rx="6" fill="#F8FAFC" stroke="#64748B"/>
  <text x="70" y="155" font-size="13" font-weight="bold" fill="#002A5C">Khách đặt hàng</text>
  <text x="70" y="175" font-size="11" fill="#64748B">(Web / Mobile App)</text>

  <path d="M 205 165 L 295 165" stroke="#B42318" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="215" y="155" font-size="11" font-weight="bold" fill="#B42318">1. Đứng chờ tại quầy</text>

  <!-- Nhan vien Thu ngan -->
  <rect x="305" y="130" width="170" height="70" rx="6" fill="#FEECEB" stroke="#B42318"/>
  <text x="320" y="155" font-size="13" font-weight="bold" fill="#B42318">Nhân viên Thu ngân</text>
  <text x="320" y="175" font-size="11" fill="#B42318">(Bị chặn, không nhận đơn mới)</text>

  <path d="M 475 150 L 575 140" stroke="#B42318" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <path d="M 475 180 L 575 190" stroke="#B42318" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Quay Bar & Bep -->
  <rect x="585" y="125" width="220" height="40" rx="5" fill="#F8FAFC" stroke="#64748B"/>
  <text x="600" y="150" font-size="12" fill="#334155">Quầy pha chế (Làm nước 5 phút)</text>

  <rect x="585" y="175" width="220" height="40" rx="5" fill="#F8FAFC" stroke="#64748B"/>
  <text x="600" y="200" font-size="12" fill="#334155">Bếp bánh (Nướng bánh 10 phút)</text>

  <!-- Hau qua -->
  <rect x="835" y="125" width="210" height="90" rx="6" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="845" y="147" font-size="11.5" font-weight="bold" fill="#991B1B">HẬU QUẢ:</text>
  <text x="845" y="167" font-size="10.5" fill="#334155">• Khách hàng phải đứng chờ lâu.</text>
  <text x="845" y="185" font-size="10.5" fill="#334155">• 1 bên chậm $\to$ Toàn bộ bị nghẽn!</text>
  <text x="845" y="203" font-size="10.5" fill="#334155">• Bếp sập $\to$ Mất luôn đơn hàng.</text>

  <!-- ==================== BOTTOM: CÁCH 2 - DÙNG KAFKA (DECOUPLED) ==================== -->
  <rect x="35" y="295" width="1030" height="240" rx="8" fill="#FFFFFF" stroke="#0B5FA5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="35" y="295" width="1030" height="34" rx="8" fill="#EAF0F6"/>
  <text x="50" y="318" font-size="14" font-weight="bold" fill="#002A5C">CÁCH 2: DÙNG KAFKA EVENT BUS — TÁCH RỜI HOÀN TOÀN (DECOUPLED &amp; ASYNCHRONOUS)</text>

  <!-- Khach hang Producer -->
  <rect x="55" y="355" width="140" height="60" rx="6" fill="#EAF0F6" stroke="#0B5FA5"/>
  <text x="70" y="380" font-size="12.5" font-weight="bold" fill="#002A5C">Khách đặt món</text>
  <text x="70" y="398" font-size="11" fill="#475467">(PRODUCER)</text>

  <path d="M 195 385 L 265 385" stroke="#0B5FA5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="200" y="375" font-size="10" fill="#0B5FA5">Gửi đơn</text>

  <!-- Kafka Commit Log (Bang phieu) -->
  <rect x="275" y="345" width="310" height="175" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="290" y="370" font-size="13" font-weight="bold" fill="#15803D">KAFKA TOPIC (Bảng Phiếu Thứ Tự)</text>
  <text x="290" y="388" font-size="10.5" fill="#475467">Lưu bền vững trên đĩa theo số Offset</text>

  <!-- Tickets -->
  <rect x="290" y="400" width="85" height="32" rx="4" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="298" y="420" font-size="11" font-weight="bold" fill="#002A5C">Offset 101</text>

  <rect x="385" y="400" width="85" height="32" rx="4" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="393" y="420" font-size="11" font-weight="bold" fill="#002A5C">Offset 102</text>

  <rect x="480" y="400" width="85" height="32" rx="4" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="488" y="420" font-size="11" font-weight="bold" fill="#002A5C">Offset 103</text>

  <text x="290" y="460" font-size="10.5" fill="#15803D">✔ Khách nhận phiếu số rồi đi chỗ khác lướt điện thoại!</text>
  <text x="290" y="480" font-size="10.5" fill="#15803D">✔ Quầy thu ngân rảnh tay nhận tiếp khách sau ngay lập tức!</text>
  <text x="290" y="500" font-size="10.5" fill="#15803D">✔ Không sợ mất đơn vì phiếu đã in vào sổ lưu bền vững.</text>

  <!-- Mui ten den cac Consumer -->
  <path d="M 585 410 L 665 380" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 585 435 L 665 440" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 585 460 L 665 495" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Consumers -->
  <rect x="675" y="360" width="370" height="42" rx="5" fill="#F8FAFC" stroke="#0B5FA5"/>
  <text x="685" y="385" font-size="11.5" font-weight="bold" fill="#002A5C">Quầy nước (Consumer 1):</text>
  <text x="840" y="385" font-size="11" fill="#475467">Pha chế dần theo Offset 101, 102...</text>

  <rect x="675" y="420" width="370" height="42" rx="5" fill="#F8FAFC" stroke="#0B5FA5"/>
  <text x="685" y="445" font-size="11.5" font-weight="bold" fill="#002A5C">Bếp bánh (Consumer 2):</text>
  <text x="840" y="445" font-size="11" fill="#475467">Nướng bánh độc lập theo nhịp riêng</text>

  <rect x="675" y="475" width="370" height="42" rx="5" fill="#F8FAFC" stroke="#0B5FA5"/>
  <text x="685" y="500" font-size="11.5" font-weight="bold" fill="#002A5C">Kế toán / Spark (Consumer 3):</text>
  <text x="840" y="500" font-size="11" fill="#475467">Đọc lại từ Offset 0 để tính tổng tiền</text>
</svg>
