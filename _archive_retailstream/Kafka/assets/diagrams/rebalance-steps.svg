<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowRed3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B42318"/>
    </marker>
    <marker id="arrowGreen3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803D"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="520" rx="12" fill="url(#bgGrad3)" stroke="#D7DEE8" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="40" y="38" font-size="20" font-weight="bold" fill="#002A5C">QUY TRÌNH 3 BƯỚC TỰ PHỤC HỒI: CONSUMER SẬP NGUỒN VÀ TÁI CÂN BẰNG (REBALANCE)</text>
  <text x="40" y="60" font-size="13" fill="#667085">Giảng viên chỉ vào từng bước: Trạng thái bình thường $\to$ Phát hiện sự cố $\to$ Bàn giao Partition và đọc tiếp từ Offset</text>

  <!-- ==================== 3 BƯỚC NGANG ==================== -->

  <!-- BƯỚC 1: BÌNH THƯỜNG -->
  <rect x="35" y="90" width="320" height="300" rx="8" fill="#FFFFFF" stroke="#0B5FA5" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="35" y="90" width="320" height="34" rx="8" fill="#EAF0F6"/>
  <text x="45" y="113" font-size="13.5" font-weight="bold" fill="#002A5C">BƯỚC 1: TRẠNG THÁI BÌNH THƯỜNG</text>

  <rect x="50" y="140" width="290" height="65" rx="5" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="60" y="162" font-size="12" font-weight="bold" fill="#002A5C">Topic "clickstream" (4 Partitions):</text>
  <text x="60" y="185" font-size="11" fill="#334155">P0 (55 msgs) | P1 (55 msgs) | P2 (41) | P3 (49)</text>

  <!-- Consumer 1 & 2 -->
  <rect x="50" y="220" width="135" height="70" rx="5" fill="#F0FDF4" stroke="#16A34A"/>
  <text x="60" y="245" font-size="12" font-weight="bold" fill="#15803D">Consumer C1</text>
  <text x="60" y="265" font-size="10.5" fill="#334155">Đọc: [ P0, P1 ]</text>
  <text x="60" y="280" font-size="10" fill="#15803D">✔ Sống khỏe mạnh</text>

  <rect x="205" y="220" width="135" height="70" rx="5" fill="#F0FDF4" stroke="#16A34A"/>
  <text x="215" y="245" font-size="12" font-weight="bold" fill="#15803D">Consumer C2</text>
  <text x="215" y="265" font-size="10.5" fill="#334155">Đọc: [ P2, P3 ]</text>
  <text x="215" y="280" font-size="10" fill="#15803D">✔ Sống khỏe mạnh</text>

  <text x="50" y="325" font-size="11" fill="#475467">• 2 Consumer cùng group `demo-shared`.</text>
  <text x="50" y="345" font-size="11" fill="#475467">• Tải được chia đều $50\% - 50\%$.</text>
  <text x="50" y="365" font-size="11" fill="#15803D">• Gửi Heartbeat định kỳ về Broker.</text>

  <!-- BƯỚC 2: SỰ CỐ SẬP -->
  <rect x="385" y="90" width="320" height="300" rx="8" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="385" y="90" width="320" height="34" rx="8" fill="#FEECEB"/>
  <text x="395" y="113" font-size="13.5" font-weight="bold" fill="#B42318">BƯỚC 2: CONSUMER C2 BỊ SẬP</text>

  <!-- Crash box -->
  <rect x="400" y="140" width="290" height="65" rx="5" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="410" y="162" font-size="12" font-weight="bold" fill="#991B1B">SỰ CỐ XẢY RA:</text>
  <text x="410" y="185" font-size="11" fill="#B42318">Mất điện / Hết RAM / Rút dây mạng nút C2</text>

  <!-- Heartbeat timeout -->
  <rect x="400" y="220" width="135" height="70" rx="5" fill="#F0FDF4" stroke="#16A34A"/>
  <text x="410" y="245" font-size="12" font-weight="bold" fill="#15803D">Consumer C1</text>
  <text x="410" y="265" font-size="10.5" fill="#334155">Đọc: [ P0, P1 ]</text>
  <text x="410" y="280" font-size="10" fill="#15803D">✔ Vẫn sống</text>

  <rect x="555" y="220" width="135" height="70" rx="5" fill="#FEECEB" stroke="#B42318" stroke-dasharray="3,3"/>
  <text x="565" y="245" font-size="12" font-weight="bold" fill="#B42318">Consumer C2 ✘</text>
  <text x="565" y="265" font-size="10.5" fill="#B42318">ĐÃ CHẾT!</text>
  <text x="565" y="280" font-size="9.5" fill="#B42318">Ngừng gửi Heartbeat</text>

  <text x="400" y="325" font-size="11" fill="#B42318">• Quá hạn `session.timeout.ms` (45s):</text>
  <text x="400" y="345" font-size="11" fill="#334155">• Broker Group Coordinator phát hiện C2 chết.</text>
  <text x="400" y="365" font-size="11" font-weight="bold" fill="#B42318">• KÍCH HOẠT REBALANCE NGAY LẬP TỨC!</text>

  <!-- BƯỚC 3: PHỤC HỒI -->
  <rect x="735" y="90" width="330" height="300" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="735" y="90" width="330" height="34" rx="8" fill="#F0FDF4"/>
  <text x="745" y="113" font-size="13.5" font-weight="bold" fill="#15803D">BƯỚC 3: TÁI CÂN BẰNG THÀNH CÔNG</text>

  <!-- Rebalance result -->
  <rect x="750" y="140" width="300" height="150" rx="5" fill="#F0FDF4" stroke="#16A34A"/>
  <text x="760" y="165" font-size="13" font-weight="bold" fill="#15803D">Consumer C1 GÁNH HẾT TẤT CẢ!</text>
  <text x="760" y="190" font-size="12" fill="#002A5C">Partition mới: <tspan font-weight="bold">[ P0, P1, P2, P3 ]</tspan></text>
  
  <rect x="760" y="205" width="280" height="65" rx="4" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="770" y="225" font-size="11" font-weight="bold" fill="#15803D">ĐỌC TỪ COMMITTED OFFSET:</text>
  <text x="770" y="243" font-size="10" fill="#334155">C2 trước khi chết đã đọc tới đâu,</text>
  <text x="770" y="258" font-size="10" fill="#334155">C1 đọc tiếp đúng từ đó $\to$ 0 mất mát!</text>

  <text x="750" y="325" font-size="11" font-weight="bold" fill="#15803D">CAM KẾT CHỊU LỖI (FAULT-TOLERANCE):</text>
  <text x="750" y="345" font-size="10.5" fill="#334155">• Dịch vụ không bị gián đoạn vĩnh viễn.</text>
  <text x="750" y="365" font-size="10.5" fill="#334155">• Không mất sự kiện nào, không đọc lặp lại.</text>

  <!-- ==================== BOTTOM NOTE FOR LECTURER ==================== -->
  <rect x="35" y="410" width="1030" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="50" y="433" font-size="12.5" font-weight="bold" fill="#002A5C">GỢI Ý GIẢNG DẠY (LỜI THOẠI GIẢNG VIÊN):</text>
  <text x="50" y="455" font-size="11.5" fill="#334155">"Các em nhìn vào Bước 2: Giả sử máy bạn C2 bị đứt cáp mạng. Kafka có bị mất dữ liệu không? Hoàn toàn KHÔNG! Vì vị trí đọc đã được lưu lại trong topic nội bộ `__consumer_offsets`. Sang Bước 3, bạn C1 đứng lên gánh luôn phần việc của C2 mà không cần khởi động lại hệ thống!"</text>
  <text x="50" y="480" font-size="11" font-style="italic" fill="#0B5FA5">$\implies$ Giảng viên chỉ cần chỉ vào 3 hộp màu này là sinh viên hiểu trọn vẹn khái niệm Rebalancing mà không cần nhớ lý thuyết dài dòng!</text>
</svg>
