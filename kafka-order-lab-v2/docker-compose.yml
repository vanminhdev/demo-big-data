services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-order-lab-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 604800000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    pull_policy: never

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-order-lab-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --create \
          --if-not-exists \
          --topic order-events \
          --bootstrap-server kafka:9092 \
          --partitions 4 \
          --replication-factor 1
    restart: "no"
    pull_policy: never

  api:
    build:
      context: ./app
    image: kafka-order-lab-app:1.0
    container_name: kafka-order-lab-api
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_API_BASE_URL: http://api:8000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    pull_policy: never

  consumer:
    image: kafka-order-lab-app:1.0
    container_name: kafka-order-lab-consumer-1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_API_BASE_URL: http://api:8000
      KAFKA_GROUP_ID: order-service
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["python", "consumer.py"]
    pull_policy: never

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-order-lab-ui
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    pull_policy: never

volumes:
  kafka-data:
